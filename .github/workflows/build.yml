name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [firmware/base, firmware/birdy-2ble]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build ${{ matrix.project }}
        run: pio run -d ${{ matrix.project }}

      - name: Check firmware artifacts
        run: |
          test -f ${{ matrix.project }}/.pio/build/nicenano/firmware.elf
          test -f ${{ matrix.project }}/.pio/build/nicenano/firmware.hex
          echo "Firmware OK"

      - name: Make UF2
        run: |
          python scripts/elf2uf2.py \
            ${{ matrix.project }}/.pio/build/nicenano/firmware.elf \
            firmware.uf2

      - name: Upload firmware (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ strategy.job-index }}
          path: |
            firmware.uf2
            ${{ matrix.project }}/.pio/build/nicenano/firmware.elf
            ${{ matrix.project }}/.pio/build/nicenano/firmware.hex
