; 2BLE — CO2-Birdy (BTHome BLE) + серво + пьезо + GATT-управление по BLE.
; Базовый стек — рабочий эталон oxyphil-x/CO2-BTHome-sensor:
;   platform nordicnrf52 + framework arduino (Adafruit core) + SparkFun SCD4x.
;
; Пины на nRF52840 SuperMini (Nice!Nano):
;   SCD41: SDA = P0.17, SCL = P0.20 (в коде main.cpp)
;   серво:  P0.24 (BIRDY_SERVO_PIN)
;   пьезо:  P0.22 (BIRDY_PIEZO_PIN)
;
; 2BLE: реклама CONNECTABLE + 2 подключения (BTHOME_PRPH_CONN=2),
;   GATT-сервис 0xFFF0: cmd 0xFFF1 (запись), status 0xFFF2 (notify), info 0xFFF3 (чтение),
;   настройки в NVS (/birdy.cfg), окно connectable-рекламы 30 с после отчёта.

[env:nicenano]
platform = nordicnrf52
board = nicenano
framework = arduino
lib_deps =
	sparkfun/SparkFun SCD4x Arduino Library@^1.1.2
monitor_speed = 115200
build_flags =
	-DBIRDY=1
	-DBIRDY_2BLE=1
	-DBTHOME_PRPH_CONN=2
	-DBIRDY_SERVO_PIN=24
	-DBIRDY_PIEZO_PIN=22
	-DBIRDY_CO2_BAD=600
	-DBIRDY_STATUS_DEAD_TICKS=1
	-DBIRDY_STATUS_REVIVE_TICKS=1
	-DBIRDY_ANGLE_ALIVE=0
	-DBIRDY_ANGLE_DEAD=100
	-DBIRDY_TRANSITION_SEC=3
	-DBIRDY_SOUND_ENABLED=1
	-DBIRDY_CHIRP_UP=0
	-DBIRDY_CHIRP_DOWN=0
	-DBIRDY_CHIRP_UP_VAR=0
	-DBIRDY_CHIRP_DOWN_VAR=0
	-DBIRDY_SPC_MAX_PPM=600
	; АКБ: делитель на P0.31, R_top=R_bot=15 кОм (153), коэффициент 2.0, точное чтение ADC
	-DBIRDY_VBAT_PIN=31
	-DBIRDY_VBAT_R_TOP=15000
	-DBIRDY_VBAT_R_BOT=15000
	-DBIRDY_VBAT_LOW_MV=3300

; ДИАГНОСТИКА: серво = стрелка CO2 (400 ppm -> -100 %, 1200 ppm -> +100 %).
[env:birdy_gauge]
extends = env:nicenano
build_flags =
	${env:nicenano.build_flags}
	-DBIRDY_MODE_GAUGE=1
