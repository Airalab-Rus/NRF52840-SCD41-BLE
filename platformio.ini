; OXY-TEST — решающий тест SCD41 на нашей SuperMini.
; Ровно тот же стек, что в рабочем эталоне oxyphil-x/CO2-BTHome-sensor:
;   platform nordicnrf52 + framework arduino (Adafruit core) + SparkFun SCD4x.
; Без дисплея (GxEPD2/U8g2 не нужны — нам только I2C + BLE-реклама).

[env:nicenano]
platform = nordicnrf52
board = nicenano
framework = arduino
lib_deps =
	sparkfun/SparkFun SCD4x Arduino Library@^1.1.2
monitor_speed = 115200
